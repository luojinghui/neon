name: Build and deploy Neon

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Build, transfer and activate release
    if: github.repository == 'luojinghui/neon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install and build on the runner
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          NODE_OPTIONS='--max-old-space-size=1024' pnpm build

      - name: Package production release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="${RUNNER_TEMP}/neon-release"
          mkdir -p "${release_dir}"

          cp -R .next public src "${release_dir}/"
          rm -rf "${release_dir}/.next/cache"
          cp package.json pnpm-lock.yaml next.config.mjs ecosystem.config.cjs "${release_dir}/"

          cd "${release_dir}"
          pnpm install --prod --frozen-lockfile --ignore-scripts
          tar -czf "${GITHUB_WORKSPACE}/neon-release.tar.gz" .

      - name: Transfer and activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail

          required=(
            DEPLOY_HOST
            DEPLOY_PORT
            DEPLOY_USER
            DEPLOY_PRIVATE_KEY
            DEPLOY_KNOWN_HOSTS
            DEPLOY_PATH
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production secret: ${name}" >&2
              exit 1
            fi
          done

          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid DEPLOY_HOST' >&2; exit 1; }
          [[ "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid DEPLOY_PORT' >&2; exit 1; }
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo 'Invalid DEPLOY_PORT' >&2; exit 1; }
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid DEPLOY_USER' >&2; exit 1; }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'Invalid DEPLOY_PATH' >&2; exit 1; }

          ssh_dir="${RUNNER_TEMP}/neon-ssh"
          install -m 700 -d "${ssh_dir}"
          printf '%s\n' "${DEPLOY_PRIVATE_KEY}" > "${ssh_dir}/deploy_key"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${ssh_dir}/known_hosts"
          chmod 600 "${ssh_dir}/deploy_key" "${ssh_dir}/known_hosts"

          ssh_options=(
            -i "${ssh_dir}/deploy_key"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${ssh_dir}/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          scp_options=(
            -i "${ssh_dir}/deploy_key"
            -P "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${ssh_dir}/known_hosts"
            -o ConnectTimeout=15
          )

          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_archive="${DEPLOY_PATH}/incoming/${release_id}.tar.gz"

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p -- '${DEPLOY_PATH}/incoming'"
          scp "${scp_options[@]}" neon-release.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${DEPLOY_PATH}' '${release_id}'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          app_root="$1"
          release_id="$2"
          [[ "${app_root}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'Invalid app root' >&2; exit 1; }
          [[ "${release_id}" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]] || { echo 'Invalid release id' >&2; exit 1; }

          archive="${app_root}/incoming/${release_id}.tar.gz"
          release_dir="${app_root}/releases/${release_id}"
          env_file="${app_root}/shared/app.env"
          previous_target="$(readlink -f "${app_root}/current" 2>/dev/null || true)"

          [[ -f "${archive}" ]] || { echo 'Release archive is missing' >&2; exit 1; }
          [[ ! -e "${release_dir}" ]] || { echo 'Release directory already exists' >&2; exit 1; }
          [[ -f "${env_file}" ]] || { echo "Missing ${env_file}" >&2; exit 1; }

          mkdir -p \
            "${app_root}/releases" \
            "${app_root}/shared/upload" \
            "${app_root}/shared/static" \
            "${app_root}/shared/soul-data" \
            "${app_root}/shared/soul-uploads/soul"
          if [[ ! -f "${app_root}/shared/soul-data/soul-chat.json" && -f "${previous_target}/.data/soul-chat.json" ]]; then
            cp "${previous_target}/.data/soul-chat.json" "${app_root}/shared/soul-data/soul-chat.json"
          fi
          previous_uploads="$(readlink -f "${previous_target}/public/uploads/soul" 2>/dev/null || true)"
          shared_uploads="$(readlink -f "${app_root}/shared/soul-uploads/soul")"
          if [[ -n "${previous_uploads}" && -d "${previous_uploads}" && "${previous_uploads}" != "${shared_uploads}" ]]; then
            cp -an "${previous_uploads}/." "${shared_uploads}/"
          fi
          mkdir "${release_dir}"
          tar --extract --gzip --file "${archive}" --directory "${release_dir}" \
            --no-same-owner --no-same-permissions
          ln -s "${app_root}/shared/upload" "${release_dir}/upload"
          ln -s "${app_root}/shared/static" "${release_dir}/static"
          rm -rf -- "${release_dir}/public/uploads"
          ln -s "${app_root}/shared/soul-uploads" "${release_dir}/public/uploads"

          if [[ -s "${HOME}/.nvm/nvm.sh" ]]; then
            # shellcheck disable=SC1091
            . "${HOME}/.nvm/nvm.sh"
          fi
          command -v node >/dev/null || { echo 'Node.js is not available' >&2; exit 1; }
          command -v pm2 >/dev/null || { echo 'PM2 is not available' >&2; exit 1; }

          set -a
          # shellcheck disable=SC1090
          . "${env_file}"
          set +a
          export SOUL_CHAT_DATA_FILE="${SOUL_CHAT_DATA_FILE:-${app_root}/shared/soul-data/soul-chat.json}"
          app_port="${APP_PORT:-3000}"
          [[ "${app_port}" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid APP_PORT' >&2; exit 1; }

          start_release() {
            local target_dir="$1"
            local target_id="$2"

            export NEON_RELEASE_ID="${target_id}"
            pm2 delete neon >/dev/null 2>&1 || true
            pm2 start "${target_dir}/ecosystem.config.cjs" --update-env
          }

          ln -sfn "${release_dir}" "${app_root}/current"

          healthy=false
          if start_release "${release_dir}" "${release_id}"; then
            for _ in $(seq 1 20); do
              running_pid="$(pm2 pid neon 2>/dev/null || true)"
              running_dir=''
              if [[ "${running_pid}" =~ ^[0-9]+$ ]] && (( running_pid > 0 )); then
                running_dir="$(readlink -f "/proc/${running_pid}/cwd" 2>/dev/null || true)"
              fi

              health_body="$(curl --fail --silent --show-error \
                "http://127.0.0.1:${app_port}/healthz" 2>/dev/null || true)"
              if [[ "${running_dir}" == "${release_dir}" ]] && \
                node -e '
                  const health = JSON.parse(process.argv[1]);
                  process.exit(
                    health.status === "ok" && health.releaseId === process.argv[2] ? 0 : 1
                  );
                ' "${health_body}" "${release_id}" 2>/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
          fi

          if [[ "${healthy}" != true ]]; then
            echo "Release ${release_id} failed identity-aware health check; rolling back" >&2
            if [[ -n "${previous_target}" && -d "${previous_target}" ]]; then
              ln -sfn "${previous_target}" "${app_root}/current"
              previous_release_id="${previous_target%/}"
              previous_release_id="${previous_release_id##*/}"
              start_release "${previous_target}" "${previous_release_id}"
              pm2 save
            else
              pm2 delete neon || true
            fi
            exit 1
          fi

          pm2 save
          rm -f "${archive}"

          current_target="$(readlink -f "${app_root}/current")"
          # shellcheck disable=SC2012
          while IFS= read -r stale_release; do
            stale_release="${stale_release%/}"
            stale_name="${stale_release##*/}"
            [[ "${stale_release}" == "${app_root}/releases/${stale_name}" ]] || continue
            [[ "${stale_name}" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]] || continue
            [[ "${stale_release}" == "${current_target}" ]] || rm -rf -- "${stale_release}"
          done < <(ls -1dt -- "${app_root}"/releases/*/ | tail -n +6)

          echo "Activated release ${release_id}"
          REMOTE_SCRIPT
